# Production profile – PostgreSQL (PostGIS optional)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civicshield}
spring.datasource.username=${DB_USERNAME:civicshield}
spring.datasource.password=${DB_PASSWORD:civicshield}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Point to the Python AI service in production (falls back to Java engine)
civicshield.ai.enabled=${AI_ENABLED:false}
civicshield.ai.base-url=${AI_BASE_URL:http://localhost:8000}

# Seed demo data only on an empty database (set false for real deployments)
civicshield.seed.enabled=${SEED_DEMO_DATA:true}
