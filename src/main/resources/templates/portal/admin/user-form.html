<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout-portal :: head(${isNew ? 'Create User' : 'Edit User'} + ' – CivicShield Admin')}"></head>
<body class="bg-[#0B1220] text-slate-100 min-h-screen flex">

    <div th:replace="~{fragments/sidebar :: sidebar('users')}"></div>

    <div class="flex-1 flex flex-col min-w-0 md:pl-64">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div th:replace="~{fragments/flash-messages :: flash}"></div>

        <main class="flex-1 p-4 md:p-8 max-w-2xl mx-auto w-full space-y-6 overflow-y-auto">
            
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="font-heading font-extrabold text-2xl text-white" th:text="${isNew ? 'Create Portal Account' : 'Edit User Profile'}">
                        Create Portal Account
                    </h1>
                    <p class="text-xs text-slate-400">Configure role clearances and account access status</p>
                </div>
                <a th:href="@{/portal/admin/users}" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-semibold transition-colors">
                    ← Back to Users
                </a>
            </div>

            <div class="glass-panel p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl">
                <form th:action="@{/portal/admin/users/save}" th:object="${userForm}" method="post" class="space-y-5">
                    <input type="hidden" th:field="*{userId}"/>

                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Official Name *</label>
                        <input type="text" th:field="*{name}" placeholder="e.g. Inspector Ramesh V"
                               class="w-full bg-slate-900 border text-sm text-slate-100 rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-400"
                               th:classappend="${#fields.hasErrors('name')} ? 'border-rose-500' : 'border-slate-700'"/>
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-[11px] text-rose-400 mt-1 font-mono"></p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address (Login Username) *</label>
                        <input type="email" th:field="*{email}" placeholder="ramesh@civicshield.in"
                               class="w-full bg-slate-900 border text-sm text-slate-100 rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-400 font-mono"
                               th:classappend="${#fields.hasErrors('email')} ? 'border-rose-500' : 'border-slate-700'"/>
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-[11px] text-rose-400 mt-1 font-mono"></p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
                            Password <span th:if="${isNew}">* (Min 8 characters)</span><span th:unless="${isNew}">(Leave blank to keep current)</span>
                        </label>
                        <input type="password" th:field="*{password}" 
                               class="w-full bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-400 font-mono"/>
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-[11px] text-rose-400 mt-1 font-mono"></p>
                    </div>

                    <!-- Role Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Jurisdiction Role Clearance *</label>
                        <select th:field="*{role}" class="w-full bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-xl px-4 py-2.5 focus:outline-none focus:border-cyan-400">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label + ' – ' + r.description}">Role</option>
                        </select>
                    </div>

                    <!-- Enabled Toggle -->
                    <div class="pt-2">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" th:field="*{enabled}" class="w-4 h-4 text-cyan-500 rounded bg-slate-900 border-slate-700 focus:ring-0">
                            <span class="text-xs text-slate-300">Account Enabled (User can authenticate)</span>
                        </label>
                    </div>

                    <div class="pt-6 border-t border-slate-800 flex items-center justify-end gap-3">
                        <a th:href="@{/portal/admin/users}" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-colors">
                            Cancel
                        </a>
                        <button type="submit" 
                                class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-indigo-500 hover:from-cyan-300 hover:to-indigo-400 text-slate-950 font-bold text-xs shadow-lg shadow-cyan-500/20 transition-all">
                            Save User Account
                        </button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
