<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Alert card with Acknowledge and Resolve actions -->
<div th:fragment="card(alert, currentStatus)" 
     class="glass-panel p-4 sm:p-5 rounded-xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-all duration-200"
     th:classappend="${alert.priority.css == 'critical'} ? 'border-red-800/60 bg-red-950/10' : (${alert.priority.css == 'high'} ? 'border-orange-800/60 bg-orange-950/10' : 'border-slate-800')">
    
    <div class="flex items-start gap-3.5 flex-1 min-w-0">
        <div class="p-2 rounded-lg mt-0.5"
             th:classappend="${alert.priority.css == 'critical'} ? 'bg-red-900/40 text-red-400' : (${alert.priority.css == 'high'} ? 'bg-orange-900/40 text-orange-400' : 'bg-amber-900/40 text-amber-400')">
            <i data-lucide="bell" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
                <span th:replace="~{fragments/priority-badge :: badge(${alert.priority})}"></span>
                <span th:replace="~{fragments/status-badge :: badge(${alert.alertStatus})}"></span>
                <span class="text-[11px] font-mono text-slate-400" th:text="${#temporals.format(alert.alertDate, 'dd MMM yyyy, HH:mm')}">Time</span>
            </div>
            <p class="text-sm text-slate-200 leading-relaxed font-medium" th:text="${alert.message}">Alert message</p>
            <div class="flex items-center gap-3 mt-1.5 text-xs text-slate-400">
                <a th:href="@{/portal/incidents/{id}(id=${alert.riskAnalysis.incident.incidentId})}" 
                   class="text-cyan-400 hover:text-cyan-300 font-mono underline flex items-center gap-1">
                    <span th:text="${alert.riskAnalysis.incident.code}">INC-0001</span>
                    <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
                </a>
                <span>·</span>
                <span class="truncate" th:text="${alert.riskAnalysis.incident.location}">Location</span>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 flex-shrink-0 self-end sm:self-center">
        <!-- Acknowledge -->
        <form th:if="${alert.alertStatus.name() == 'ACTIVE'}" 
              th:action="@{/portal/alerts/{id}/acknowledge(id=${alert.alertId})}" method="post">
            <input type="hidden" name="redirectStatus" th:value="${currentStatus}">
            <button type="submit" 
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30 transition-colors flex items-center gap-1.5">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
                Acknowledge
            </button>
        </form>

        <!-- Resolve -->
        <form th:if="${alert.alertStatus.name() != 'RESOLVED'}" 
              th:action="@{/portal/alerts/{id}/resolve(id=${alert.alertId})}" method="post">
            <input type="hidden" name="redirectStatus" th:value="${currentStatus}">
            <button type="submit" 
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/30 transition-colors flex items-center gap-1.5">
                <i data-lucide="check-check" class="w-3.5 h-3.5"></i>
                Resolve
            </button>
        </form>
    </div>
</div>
</html>
