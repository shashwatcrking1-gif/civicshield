<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<button th:fragment="toggle" type="button" data-action="toggle-theme" 
        class="p-2.5 rounded-xl border border-slate-700/60 bg-slate-800/40 text-slate-300 hover:text-white hover:border-slate-600 transition-colors"
        title="Toggle Light/Dark Theme">
    <span class="theme-icon-moon text-sm">🌙</span>
    <span class="theme-icon-sun text-sm hidden">☀️</span>
</button>
</html>
