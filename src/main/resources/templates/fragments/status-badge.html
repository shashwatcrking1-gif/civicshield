<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<span th:fragment="badge(status)"
      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-mono font-medium border"
      th:classappend="${status.css == 'ok'} ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/60' : (${status.css == 'warn'} ? 'bg-amber-950/60 text-amber-300 border-amber-800/60' : (${status.css == 'danger'} ? 'bg-rose-950/60 text-rose-300 border-rose-800/60' : 'bg-sky-950/60 text-sky-300 border-sky-800/60'))">
    <span th:text="${status.label}">Reported</span>
</span>
</html>
