<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="card(title, description, icon, tag)" 
     class="glass-panel p-6 rounded-2xl relative overflow-hidden group hover:border-cyan-500/40 transition-all duration-300">
    <div class="w-12 h-12 rounded-xl bg-cyan-950/60 border border-cyan-800/50 text-cyan-400 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-cyan-500/20 transition-all">
        <i th:data-lucide="${icon ?: 'zap'}" class="w-6 h-6"></i>
    </div>
    <span th:if="${tag}" class="text-[10px] font-mono uppercase tracking-wider text-cyan-400 mb-1 block" th:text="${tag}">TAG</span>
    <h3 class="font-heading font-semibold text-lg text-white mb-2 group-hover:text-cyan-400 transition-colors" th:text="${title}">Feature Title</h3>
    <p class="text-sm text-slate-400 leading-relaxed" th:text="${description}">Feature description...</p>
</div>
</html>
