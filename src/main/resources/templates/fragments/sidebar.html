<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<aside th:fragment="sidebar(activeNav)" id="portal-sidebar" 
       class="fixed inset-y-0 left-0 z-40 w-64 bg-[#111A2E] border-r border-[#1F2A44] transition-transform duration-300 -translate-x-full md:translate-x-0 flex flex-col justify-between">
    
    <div>
        <!-- Brand Header -->
        <div class="h-16 flex items-center gap-3 px-6 border-b border-[#1F2A44] bg-[#0E1526]">
            <a th:href="@{/}" class="flex items-center gap-2.5">
                <img th:src="@{/favicon.svg}" alt="Logo" class="w-8 h-8"/>
                <div>
                    <span class="font-heading font-bold text-base text-white tracking-tight">CivicShield</span>
                    <span class="block text-[10px] font-mono text-cyan-400 -mt-1">PORTAL</span>
                </div>
            </a>
        </div>

        <!-- Navigation Links -->
        <nav class="p-4 space-y-1 text-sm font-medium">
            <!-- All Roles: Dashboard -->
            <a th:href="@{/portal/dashboard}" 
               th:classappend="${activeNav == 'dashboard'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Dashboard
            </a>

            <!-- Map: ADMIN, EMERGENCY_SERVICE, HOSPITAL -->
            <a sec:authorize="hasAnyRole('ADMIN', 'AUTHORITY', 'EMERGENCY_SERVICE', 'HOSPITAL')" 
               th:href="@{/portal/map}" 
               th:classappend="${activeNav == 'map'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="map-pin" class="w-4 h-4"></i>
                Crisis Map
            </a>

            <!-- Incidents: ADMIN, AUTHORITY, EMERGENCY_SERVICE -->
            <a sec:authorize="hasAnyRole('ADMIN', 'AUTHORITY', 'EMERGENCY_SERVICE')" 
               th:href="@{/portal/incidents}" 
               th:classappend="${activeNav == 'incidents'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                Incidents &amp; Chain
            </a>

            <!-- Alerts: Everyone -->
            <a th:href="@{/portal/alerts}" 
               th:classappend="${activeNav == 'alerts'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="bell-ring" class="w-4 h-4"></i>
                Alerts Center
            </a>

            <!-- Recommendations: ADMIN, AUTHORITY, EMERGENCY_SERVICE -->
            <a sec:authorize="hasAnyRole('ADMIN', 'AUTHORITY', 'EMERGENCY_SERVICE')" 
               th:href="@{/portal/recommendations}" 
               th:classappend="${activeNav == 'recommendations'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                Actions &amp; AI
            </a>

            <!-- What-If Simulator: ADMIN, AUTHORITY -->
            <a sec:authorize="hasAnyRole('ADMIN', 'AUTHORITY')" 
               th:href="@{/portal/simulator}" 
               th:classappend="${activeNav == 'simulator'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="sliders" class="w-4 h-4"></i>
                What-If Simulator
            </a>

            <!-- Reports: ADMIN, AUTHORITY -->
            <a sec:authorize="hasAnyRole('ADMIN', 'AUTHORITY')" 
               th:href="@{/portal/reports}" 
               th:classappend="${activeNav == 'reports'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="file-text" class="w-4 h-4"></i>
                Reports &amp; Export
            </a>

            <div class="pt-4 mt-4 border-t border-slate-800/80">
                <span class="px-3 text-[10px] font-mono uppercase tracking-wider text-slate-500">System Admin</span>
            </div>

            <!-- Data Sources: ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" 
               th:href="@{/portal/data-sources}" 
               th:classappend="${activeNav == 'data-sources'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="database" class="w-4 h-4"></i>
                Data Feeds
            </a>

            <!-- Users: ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" 
               th:href="@{/portal/admin/users}" 
               th:classappend="${activeNav == 'users'} ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'"
               class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all">
                <i data-lucide="users" class="w-4 h-4"></i>
                User Access
            </a>
        </nav>
    </div>

    <!-- Quick Public Link & Version -->
    <div class="p-4 border-t border-[#1F2A44] bg-[#0E1526]/60">
        <a th:href="@{/}" target="_blank" class="flex items-center justify-between text-xs text-slate-400 hover:text-cyan-400 py-1.5 transition-colors">
            <span>View Public Site</span>
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </a>
        <p class="text-[10px] text-slate-500 font-mono mt-1">CivicShield v1.0.0 · Java 17</p>
    </div>
</aside>
</html>
