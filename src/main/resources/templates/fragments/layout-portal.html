<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | CivicShield Authority Portal' : 'CivicShield Authority Portal'}">CivicShield Portal</title>
    
    <!-- CSRF Tokens for Ajax -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        shield: {
                            bg: '#0B1220',
                            surface: '#111A2E',
                            surfaceHover: '#17233E',
                            border: '#1F2A44',
                            borderSubtle: '#162035',
                            teal: '#22D3EE',
                            indigo: '#6366F1'
                        },
                        risk: {
                            low: '#22C55E',
                            medium: '#F59E0B',
                            high: '#F97316',
                            critical: '#EF4444'
                        }
                    },
                    fontFamily: {
                        heading: ['Space Grotesk', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-[#0B1220] text-slate-100 min-h-screen flex">
    
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeNav=${activeNav})}"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 md:pl-64">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <!-- Flash messages -->
        <div th:replace="~{fragments/flash-messages :: flash}"></div>

        <!-- Page View Body -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto">
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/portal-charts.js}"></script>
</body>
</html>
