<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Recommendation card with Approve / Dismiss actions -->
<div th:fragment="card(rec, currentStatus)" 
     class="glass-panel p-5 rounded-xl border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    
    <div class="flex items-start gap-3.5 flex-1 min-w-0">
        <div class="p-2.5 rounded-xl bg-cyan-950/50 border border-cyan-800/40 text-cyan-400 mt-0.5">
            <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div class="space-y-1 flex-1">
            <div class="flex flex-wrap items-center gap-2">
                <span th:replace="~{fragments/priority-badge :: badge(${rec.priority})}"></span>
                <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded border"
                      th:classappend="${rec.status.css == 'ok'} ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/60' : (${rec.status.css == 'muted'} ? 'bg-slate-800 text-slate-400 border-slate-700' : 'bg-cyan-950/60 text-cyan-300 border-cyan-800/60')"
                      th:text="${rec.status.label}">Pending review</span>
                <span class="text-xs text-slate-400">Targeting cascade node:</span>
                <span class="text-xs text-cyan-400 font-mono font-semibold" 
                      th:text="${rec.riskAnalysis.incident.incidentType.label}">Incident Type</span>
            </div>
            
            <p class="text-base text-white font-medium leading-snug" th:text="${rec.action}">Action text</p>
            
            <div class="text-xs text-slate-400 flex items-center gap-2">
                <span>Associated incident:</span>
                <a th:href="@{/portal/incidents/{id}(id=${rec.riskAnalysis.incident.incidentId})}" 
                   class="text-cyan-400 underline font-mono" 
                   th:text="${rec.riskAnalysis.incident.code + ' (' + rec.riskAnalysis.incident.location + ')'}">
                    INC-0001
                </a>
            </div>
        </div>
    </div>

    <!-- Human Decision Controls -->
    <div class="flex items-center gap-2 flex-shrink-0 self-end md:self-center">
        <form th:if="${rec.status.name() == 'PENDING'}" 
              th:action="@{/portal/recommendations/{id}/approve(id=${rec.recommendationId})}" method="post">
            <input type="hidden" name="redirectStatus" th:value="${currentStatus}">
            <button type="submit" 
                    class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center gap-1.5 shadow-md shadow-emerald-500/20 transition-all">
                <i data-lucide="check" class="w-4 h-4"></i>
                Approve Action
            </button>
        </form>

        <form th:if="${rec.status.name() == 'PENDING'}" 
              th:action="@{/portal/recommendations/{id}/dismiss(id=${rec.recommendationId})}" method="post">
            <input type="hidden" name="redirectStatus" th:value="${currentStatus}">
            <button type="submit" 
                    class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors flex items-center gap-1.5">
                <i data-lucide="x" class="w-4 h-4"></i>
                Dismiss
            </button>
        </form>

        <div th:if="${rec.status.name() != 'PENDING'}" class="text-xs font-mono text-slate-400 italic">
            Decision logged
        </div>
    </div>
</div>
</html>
