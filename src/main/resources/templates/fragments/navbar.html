<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" id="main-navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-[#0B1220]/75 backdrop-blur-md border-b border-[#1F2A44]/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Brand Logo -->
            <a th:href="@{/}" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-indigo-600 p-0.5 shadow-lg shadow-cyan-500/20 group-hover:shadow-cyan-500/40 transition-all">
                    <div class="w-full h-full bg-[#111A2E] rounded-[10px] flex items-center justify-center p-1.5">
                        <img th:src="@{/favicon.svg}" alt="CivicShield" class="w-full h-full"/>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-heading font-bold text-xl tracking-tight text-white group-hover:text-cyan-400 transition-colors">CivicShield</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-950/80 text-cyan-400 border border-cyan-800/60 uppercase">AI Shield</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-mono tracking-tight -mt-0.5">Predict the chain · Break the chain</p>
                </div>
            </a>

            <!-- Desktop Nav Links -->
            <div class="hidden lg:flex items-center gap-8">
                <a th:href="@{/}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Home</a>
                <a th:href="@{/features}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Features</a>
                <a th:href="@{/how-it-works}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">How It Works</a>
                <a th:href="@{/demo}" class="text-sm font-medium text-cyan-400 hover:text-cyan-300 transition-colors flex items-center gap-1.5">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                    </span>
                    Live Demo
                </a>
                <a th:href="@{/technology}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Technology</a>
                <a th:href="@{/about}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">About</a>
                <a th:href="@{/team}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Team</a>
                <a th:href="@{/contact}" class="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Contact</a>
            </div>

            <!-- Action Controls -->
            <div class="hidden sm:flex items-center gap-3">
                <!-- Theme Toggle Button -->
                <button type="button" data-action="toggle-theme" 
                        class="p-2.5 rounded-xl border border-slate-700/60 bg-slate-800/40 text-slate-300 hover:text-white hover:border-slate-600 transition-colors"
                        title="Toggle Light/Dark Theme">
                    <span class="theme-icon-moon text-sm">🌙</span>
                    <span class="theme-icon-sun text-sm hidden">☀️</span>
                </button>

                <!-- Auth Buttons -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-medium transition-all shadow-md shadow-cyan-500/20 hover:shadow-cyan-500/30">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        Authority Login
                    </a>
                </div>
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-2">
                    <a th:href="@{/portal/dashboard}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/30 transition-all">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        Open Portal
                    </a>
                </div>
            </div>

            <!-- Mobile Hamburger Button -->
            <div class="flex items-center gap-2 lg:hidden">
                <button type="button" data-action="toggle-theme" 
                        class="p-2 rounded-lg border border-slate-700 bg-slate-800/40 text-slate-300">
                    <span class="theme-icon-moon text-xs">🌙</span>
                    <span class="theme-icon-sun text-xs hidden">☀️</span>
                </button>
                <button id="mobile-menu-btn" type="button" class="p-2 rounded-lg border border-slate-700 bg-slate-800/50 text-slate-300 hover:text-white">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Drawer -->
    <div id="mobile-menu" class="hidden lg:hidden border-t border-[#1F2A44] bg-[#111A2E] px-4 pt-4 pb-6 space-y-3">
        <a th:href="@{/}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">Home</a>
        <a th:href="@{/features}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">Features</a>
        <a th:href="@{/how-it-works}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">How It Works</a>
        <a th:href="@{/demo}" class="block text-sm font-medium text-cyan-400">Live Demo (What-If)</a>
        <a th:href="@{/technology}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">Technology</a>
        <a th:href="@{/about}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">About</a>
        <a th:href="@{/team}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">Team</a>
        <a th:href="@{/contact}" class="block text-sm font-medium text-slate-300 hover:text-cyan-400">Contact</a>
        <div class="pt-3 border-t border-slate-800">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="block w-full text-center py-2.5 rounded-lg text-sm font-semibold bg-gradient-to-r from-cyan-500 to-indigo-600 text-slate-950">
                    Authority Login
                </a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/portal/dashboard}" class="block w-full text-center py-2.5 rounded-lg text-sm font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                    Authority Portal
                </a>
            </div>
        </div>
    </div>
</nav>
</html>
