<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22D3EE"/>
            <stop offset="100%" stop-color="#6366F1"/>
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Outer Shield Shape -->
    <path d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 Z" 
          fill="#111A2E" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Cascade Link Nodes (Connected Chain) -->
    <path d="M30 38 L42 48 L58 44 L70 56 L50 68" 
          stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
    
    <circle cx="30" cy="38" r="4.5" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="42" cy="48" r="4" fill="#38BDF8"/>
    <circle cx="58" cy="44" r="4" fill="#F59E0B"/>
    <circle cx="70" cy="56" r="4.5" fill="#F97316"/>
    <circle cx="50" cy="68" r="5.5" fill="#EF4444" filter="url(#glow)"/>

    <!-- Broken chain lightning spark at node 4 to symbolize "Break the chain" -->
    <path d="M47 30 L53 38 L49 42 L55 50" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
</svg>
