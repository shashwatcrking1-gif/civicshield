# ------------------------------------------------------------
# CivicShield – shared configuration
# Profiles: demo (H2, default) | prod (PostgreSQL)
# ------------------------------------------------------------
spring.application.name=civicshield
spring.profiles.default=demo
server.port=8080

# Views
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# JPA – keep the session open while templates render lazy relations
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Optional Python AI micro-service. When disabled or unreachable the
# built-in Java CascadeRiskEngine is used automatically.
civicshield.ai.enabled=false
civicshield.ai.base-url=http://localhost:8000
civicshield.ai.timeout-ms=1500

# Seed simulated Chennai demo data when the database is empty
civicshield.seed.enabled=true
